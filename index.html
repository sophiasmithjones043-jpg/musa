.ml-footer{background:#0f0f0f;padding:50px 16px;text-align:center;border-top:2px solid #c8b89a}
.ml-account-stat{background:#1a1a1a;padding:18px 32px;text-align:center;border:1px solid #333}
.ml-section-box{background:#fff;padding:30px;box-shadow:0 8px 30px #1a1a1a11;border:1px solid #e8e0d5}
.stripe{width:100%;height:3px;background:repeating-linear-gradient(90deg,#0f0f0f 0,#0f0f0f 12px,#c8b89a 12px,#c8b89a 24px)}
`;

function App() {
const [page,setPage]=useState("home");
const [cat,setCat]=useState("All");
const [search,setSearch]=useState("");
const [cart,setCart]=useState([]);
const [wishlist,setWishlist]=useState([]);
const [cartOpen,setCartOpen]=useState(false);
const [selected,setSelected]=useState(null);
const [user,setUser]=useState(null);
const [authMode,setAuthMode]=useState("login");
const [authForm,setAuthForm]=useState({name:"",email:"",password:""});
const [products,setProducts]=useState(INIT_PRODUCTS);
const [adminForm,setAdminForm]=useState({name:"",category:"Dresses",price:"",oldPrice:"",img:"",affiliate:"",badge:""});
const [editId,setEditId]=useState(null);
const [toast,setToast]=useState("");

const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),2200)};
const filtered=products.filter(p=>(cat==="All"||p.category===cat)&&p.name.toLowerCase().includes(search.toLowerCase()));
const addToCart=p=>{setCart(c=>{const ex=c.find(x=>x.id===p.id);return ex?c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x):[...c,{...p,qty:1}]});showToast("Added to cart ✓")};
const toggleWish=id=>setWishlist(w=>w.includes(id)?w.filter(x=>x!==id):[...w,id]);
const removeCart=id=>setCart(c=>c.filter(x=>x.id!==id));
const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
const handleAuth=()=>{if(authMode==="login"){if(authForm.email&&authForm.password){setUser({name:authForm.email.split("@")[0],email:authForm.email});setPage("home");showToast("Welcome back ✓")}}else if(authForm.name&&authForm.email&&authForm.password){setUser({name:authForm.name,email:authForm.email});setPage("home");showToast("Account created ✓")}};
const handleAdminSave=()=>{if(!adminForm.name||!adminForm.price)return;if(editId){setProducts(p=>p.map(x=>x.id===editId?{...x,...adminForm,price:+adminForm.price,oldPrice:+adminForm.oldPrice}:x));showToast("Product updated ✓");setEditId(null);setAdminForm({name:"",category:"Dresses",price:"",oldPrice:"",img:"",affiliate:"",badge:""})}else{setProducts(p=>[...p,{id:Math.max(...p.map(x=>x.id))+1,...adminForm,price:+adminForm.price,oldPrice:+adminForm.oldPrice}]);showToast("Product added ✓");setAdminForm({name:"",category:"Dresses",price:"",oldPrice:"",img:"",affiliate:"",badge:""})}};
const startEdit=p=>{setAdminForm({name:p.name,category:p.category,price:p.price,oldPrice:p.oldPrice,img:p.img,affiliate:p.affiliate,badge:p.badge});setEditId(p.id)};
const deleteProduct=id=>{setProducts(p=>p.filter(x=>x.id!==id));showToast("Deleted")};
const exportJSON=()=>{const b=new Blob([JSON.stringify(products,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="products.json";a.click()};
const exportCSV=()=>{const h=["id","name","category","price","oldPrice","badge","affiliate"];const r=products.map(p=>h.map(k=>'"'+(p[k]??"")+'"').join(","));const b=new Blob([[h.join(","),...r].join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="products.csv";a.click()};
const bc=b=>b==="Sale"?"ml-badge sale":b==="New"?"ml-badge new":"ml-badge";

const Cat3D=({c})=>(
<button className={`cat-btn-3d${cat===c?" active":""}`} onClick={()=>setCat(c)}>
<div className="cat-shadow"/>
<div className="cat-face"><span className="cat-icon">{CAT_ICONS[c]}</span><span>{c}</span></div>
</button>
);

const Card=({p})=>(
<div className="ml-card" onClick={()=>setSelected(p)}>
{p.badge&&<span className={bc(p.badge)}>{p.badge}</span>}
<button className="ml-wish-btn" onClick={e=>{e.stopPropagation();toggleWish(p.id)}}>{wishlist.includes(p.id)?"♥":"♡"}</button>
<img src={p.img} alt={p.name} className="ml-card-img"/>
<div className="ml-card-body">
<span className="ml-tag">{p.category}</span>
<div className="ml-card-name">{p.name}</div>
<div className="ml-price-row"><span className="ml-price">${p.price}</span><span className="ml-old-price">${p.oldPrice}</span></div>
<button className="ml-buy-btn" onClick={e=>{e.stopPropagation();addToCart(p)}}>Add to Cart</button>
</div>
</div>
);

return (
<div className="ml-root">
<style>{S}</style>
{toast&&<div className="ml-toast">{toast}</div>}

<nav className="ml-nav">
<div className="ml-logo" onClick={()=>setPage("home")}>✦ MUSA <span>LOOM</span></div>
<div className="ml-nav-links">
{[{id:"home",l:"Home"},{id:"shop",l:"Shop"},{id:"wishlist",l:`Wishlist (${wishlist.length})`},user?{id:"account",l:user.name}:{id:"login",l:"Login"},user?.email==="admin@musaloom.com"?{id:"admin",l:"⚙ Admin"}:null].filter(Boolean).map(({id,l})=>(
<button key={id} className={`ml-nav-btn${page===id?" active":""}`} onClick={()=>setPage(id)}>{l}</button>
))}
<button className="ml-cart-btn" onClick={()=>setCartOpen(true)}>🛒 {cart.reduce((s,x)=>s+x.qty,0)}</button>
</div>
</nav>
<div className="stripe"/>

{page==="home"&&<>
<div className="ml-hero">
<div className="ml-hero-eyebrow">Women's Fashion & Accessories</div>
<h1 className="ml-hero-title">MUSA LOOM</h1>
<div className="ml-hero-divider"/>
<p className="ml-hero-sub">Curated fashion · Timeless elegance</p>
<button className="ml-hero-btn" onClick={()=>setPage("shop")}>Explore Collection</button>
</div>
<div className="stripe"/>
<div className="ml-section">
<h2 className="ml-section-title">Shop by Category</h2>
<div className="cat-grid">{CATEGORIES.slice(1).map(c=><Cat3D key={c} c={c}/>)}</div>
<h2 className="ml-section-title" style={{marginTop:20}}>Featured Picks</h2>
<div className="ml-grid">{products.filter(p=>p.badge).slice(0,4).map(p=><Card key={p.id} p={p}/>)}</div>
</div>
<div className="stripe"/>
<div className="ml-footer">
<div style={{fontFamily:"'Cormorant Garamond',serif",color:"#c8b89a",fontSize:22,fontWeight:700,marginBottom:8,letterSpacing:3}}>FREE SHIPPING OVER $60</div>
<div style={{color:"#5a5248",fontSize:13,letterSpacing:2,textTransform:"uppercase"}}>Curated picks · Best prices · Easy returns</div>
</div>
</>}

{page==="shop"&&<div className="ml-section">
<h2 className="ml-section-title">Shop All</h2>
<div className="ml-search-wrap"><input className="ml-search" placeholder="Search products..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
<div className="cat-grid">{CATEGORIES.map(c=><Cat3D key={c} c={c}/>)}</div>
<div className="ml-grid">
{filtered.map(p=><Card key={p.id} p={p}/>)}
{filtered.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",color:"#aaa",padding:50}}>No products found.</div>}
</div>
</div>}

{page==="wishlist"&&<div className="ml-section">
<h2 className="ml-section-title">My Wishlist</h2>
<div className="ml-grid">
{products.filter(p=>wishlist.includes(p.id)).map(p=><Card key={p.id} p={p}/>)}
{wishlist.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",color:"#aaa",padding:50}}>No items yet.</div>}
</div>
</div>}

{(page==="login"||page==="account")&&<div className="ml-section" style={{maxWidth:440}}>
{user?<>
<h2 className="ml-section-title">My Account</h2>
<div className="ml-section-box" style={{textAlign:"center"}}>
<div style={{fontSize:56,marginBottom:12}}>👤</div>
<div style={{fontFamily:"'Cormorant Garamond',serif",fontWeight:700,fontSize:24,color:"#0f0f0f",letterSpacing:2}}>{user.name.toUpperCase()}</div>
<div style={{color:"#aaa",marginBottom:28,fontSize:13}}>{user.email}</div>
<div style={{display:"flex",gap:12,justifyContent:"center",marginBottom:28}}>
<div className="ml-account-stat"><div style={{fontWeight:800,color:"#f0e6d3",fontSize:26}}>{cart.reduce((s,x)=>s+x.qty,0)}</div><div style={{fontSize:11,color:"#7a6e62",letterSpacing:1,textTransform:"uppercase"}}>In Cart</div></div>
<div className="ml-account-stat"><div style={{fontWeight:800,color:"#f0e6d3",fontSize:26}}>{wishlist.length}</div><div style={{fontSize:11,color:"#7a6e62",letterSpacing:1,textTransform:"uppercase"}}>Wishlist</div></div>
</div>
<button className="ml-buy-btn" style={{padding:"13px 0"}} onClick={()=>{setUser(null);setPage("home");showToast("Logged out")}}>Logout</button>
</div>
</>:<>
<h2 className="ml-section-title">{authMode==="login"?"Login":"Sign Up"}</h2>
<div className="ml-section-box">
{authMode==="signup"&&<input className="ml-input" placeholder="Full Name" value={authForm.name} onChange={e=>setAuthForm({...authForm,name:e.target.value})}/>}
<input className="ml-input" placeholder="Email" value={authForm.email} onChange={e=>setAuthForm({...authForm,email:e.target.value})}/>
<input className="ml-input" type="password" placeholder="Password" value={authForm.password} onChange={e=>setAuthForm({...authForm,password:e.target.value})}/>
<button className="ml-buy-btn" style={{padding:"13px 0",marginBottom:16}} onClick={handleAuth}>{authMode==="login"?"Login":"Create Account"}</button>
<div style={{textAlign:"center",fontSize:13,color:"#aaa"}}>{authMode==="login"?"No account? ":"Have account? "}<span style={{color:"#0f0f0f",cursor:"pointer",fontWeight:700}} onClick={()=>setAuthMode(authMode==="login"?"signup":"login")}>{authMode==="login"?"Sign Up":"Login"}</span></div>
<div style={{textAlign:"center",fontSize:11,color:"#bbb",marginTop:10}}>ADMIN: admin@musaloom.com</div>
</div>
</>}
</div>}

{page==="admin"&&user?.email==="admin@musaloom.com"&&<div className="ml-section">
<h2 className="ml-section-title">Admin Dashboard</h2>
<div style={{display:"flex",gap:12,justifyContent:"center",marginBottom:28}}>
<button onClick={exportJSON} style={{background:"#0f0f0f",color:"#f0e6d3",border:"none",padding:"11px 28px",cursor:"pointer",fontWeight:700,fontSize:12,letterSpacing:2,textTransform:"uppercase"}}>⬇ Export JSON</button>
<button onClick={exportCSV} style={{background:"#c8b89a",color:"#0f0f0f",border:"none",padding:"11px 28px",cursor:"pointer",fontWeight:700,fontSize:12,letterSpacing:2,textTransform:"uppercase"}}>⬇ Export CSV</button>
</div>
<div className="ml-section-box" style={{marginBottom:28}}>
<h3 style={{color:"#0f0f0f",marginBottom:18,fontFamily:"'Cormorant Garamond',serif",fontSize:20,letterSpacing:2}}>{editId?"Edit Product":"Add New Product"}</h3>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
<input className="ml-input" placeholder="Name" value={adminForm.name} onChange={e=>setAdminForm({...adminForm,name:e.target.value})}/>
<select className="ml-input" value={adminForm.category} onChange={e=>setAdminForm({...adminForm,category:e.target.value})}>{CATEGORIES.slice(1).map(c=><option key={c}>{c}</option>)}</select>
<input className="ml-input" placeholder="Price" value={adminForm.price} onChange={e=>setAdminForm({...adminForm,price:e.target.value})}/>
<input className="ml-input" placeholder="Old Price" value={adminForm.oldPrice} onChange={e=>setAdminForm({...adminForm,oldPrice:e.target.value})}/>
<input className="ml-input" placeholder="Image URL" value={adminForm.img} onChange={e=>setAdminForm({...adminForm,img:e.target.value})} style={{gridColumn:"1/-1"}}/>
<input className="ml-input" placeholder="Affiliate Link" value={adminForm.affiliate} onChange={e=>setAdminForm({...adminForm,affiliate:e.target.value})}/>
<input className="ml-input" placeholder="Badge (Hot/New/Sale)" value={adminForm.badge} onChange={e=>setAdminForm({...adminForm,badge:e.target.value})}/>
</div>
<button className="ml-buy-btn" style={{padding:"13px 0"}} onClick={handleAdminSave}>{editId?"Update":"Add Product"}</button>
</div>
<h3 style={{color:"#0f0f0f",marginBottom:14,letterSpacing:2,fontSize:14,fontWeight:700,textTransform:"uppercase"}}>All Products ({products.length})</h3>
{products.map(p=>(
<div key={p.id} className="ml-admin-card">
<img src={p.img} alt={p.name} className="ml-admin-img" onError={e=>e.target.src="https://placehold.co/60x60?text=IMG"}/>
<div style={{flex:1}}><div style={{fontWeight:700,color:"#0f0f0f",fontFamily:"'Cormorant Garamond',serif",fontSize:16}}>{p.name}</div><div style={{fontSize:12,color:"#7a6e62"}}>{p.category} · ${p.price}</div></div>
<button style={{background:"#f5f0e8",border:"1px solid #c8b89a",padding:"7px 16px",cursor:"pointer",fontWeight:700,fontSize:12,marginRight:8}} onClick={()=>startEdit(p)}>Edit</button>
<button style={{background:"#0f0f0f",border:"none",padding:"7px 16px",cursor:"pointer",color:"#f0e6d3",fontWeight:700,fontSize:12}} onClick={()=>deleteProduct(p.id)}>Delete</button>
</div>
))}
</div>}

{cartOpen&&<>
<div style={{position:"fixed",inset:0,background:"#0f0f0faa",zIndex:199}} onClick={()=>setCartOpen(false)}/>
<div className="ml-cart-overlay">
<div className="ml-cart-header"><span>Cart</span><span style={{cursor:"pointer",fontSize:22,color:"#7a6e62"}} onClick={()=>setCartOpen(false)}>✕</span></div>
<div style={{overflowY:"auto",flex:1}}>
{cart.length===0&&<div style={{textAlign:"center",color:"#5a5248",padding:50,letterSpacing:2,textTransform:"uppercase",fontSize:13}}>Your cart is empty</div>}
{cart.map(item=>(
<div key={item.id} className="ml-cart-item">
<img src={item.img} alt={item.name} className="ml-cart-item-img"/>
<div style={{flex:1}}><div style={{fontWeight:600,fontSize:14,color:"#f0e6d3",fontFamily:"'Cormorant Garamond',serif"}}>{item.name}</div><div style={{color:"#c8b89a",fontWeight:700}}>${item.price} × {item.qty}</div></div>
<button style={{background:"none",border:"none",cursor:"pointer",color:"#7a6e62",fontSize:18}} onClick={()=>removeCart(item.id)}>✕</button>
</div>
))}
</div>
<div className="ml-cart-footer">
<div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:16,marginBottom:18,color:"#f0e6d3",letterSpacing:2}}><span style={{textTransform:"uppercase",fontSize:13}}>Total</span><span>${total.toFixed(2)}</span></div>
<button style={{width:"100%",background:"#f0e6d3",color:"#0f0f0f",border:"none",padding:"14px 0",fontWeight:700,fontSize:12,cursor:"pointer",letterSpacing:2,textTransform:"uppercase"}} onClick={()=>{showToast("Thanks for your order! 🎉");setCart([]);setCartOpen(false)}}>Checkout</button>
</div>
</div>
</>}

{selected&&<div className="ml-modal" onClick={()=>setSelected(null)}>
<div className="ml-modal-box" onClick={e=>e.stopPropagation()}>
<div style={{position:"relative"}}>
<img src={selected.img} alt={selected.name} className="ml-modal-img"/>
<button style={{position:"absolute",top:12,right:12,background:"#ffffffee",border:"1px solid #e8e0d5",width:36,height:36,fontSize:16,cursor:"pointer",color:"#0f0f0f"}} onClick={()=>setSelected(null)}>✕</button>
{selected.badge&&<span className={bc(selected.badge)}>{selected.badge}</span>}
</div>
<div className="ml-modal-body">
<span className="ml-tag">{selected.category}</span>
<h3 style={{margin:"10px 0",fontSize:24,fontFamily:"'Cormorant Garamond',serif",color:"#0f0f0f",letterSpacing:1}}>{selected.name}</h3>
<div className="ml-price-row"><span className="ml-price" style={{fontSize:22}}>${selected.price}</span><span className="ml-old-price">${selected.oldPrice}</span><span style={{color:"#2a7a2a",fontSize:12,fontWeight:700}}>Save {Math.round((1-selected.price/selected.oldPrice)*100)}%</span></div>
<p style={{color:"#7a6e62",fontSize:14,marginBottom:20,lineHeight:1.6}}>Handpicked affiliate product. Purchase securely from our trusted partner store.</p>
<div style={{display:"flex",gap:10}}>
<button className="ml-buy-btn" style={{flex:1,padding:"13px 0"}} onClick={()=>{addToCart(selected);setSelected(null)}}>Add to Cart</button>
<a href={selected.affiliate} target="_blank" rel="noreferrer" style={{flex:1,padding:"13px 0",background:"#c8b89a",color:"#0f0f0f",textDecoration:"none",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12,letterSpacing:2,textTransform:"uppercase",borderRadius:2}}>View</a>
</div>
</div>
</div>
</div>}
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
