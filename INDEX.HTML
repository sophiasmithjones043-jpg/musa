<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Musa Loom</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f0e8;color:#1a1a1a}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const CATEGORIES = ["All","Dresses","Tops","Bags","Jewelry","Shoes","Scarves","Sunglasses","Nail"];
const CAT_ICONS = {All:"🪄",Dresses:"🥻",Tops:"🧥",Bags:"💼",Jewelry:"📿",Shoes:"🥿",Scarves:"🎀",Sunglasses:"🕶️",Nail:"💅"};
const INIT_PRODUCTS = [
{id:1,name:"Floral Maxi Dress",category:"Dresses",price:49.99,oldPrice:79.99,img:"https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400&q=80",affiliate:"#",badge:"Hot"},
{id:2,name:"Silk Evening Gown",category:"Dresses",price:89.99,oldPrice:130.00,img:"https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=400&q=80",affiliate:"#",badge:"New"},
{id:3,name:"Casual Linen Top",category:"Tops",price:24.99,oldPrice:39.99,img:"https://images.unsplash.com/photo-1564257631407-4deb1f99d992?w=400&q=80",affiliate:"#",badge:""},
{id:4,name:"Embroidered Blouse",category:"Tops",price:34.99,oldPrice:55.00,img:"https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=400&q=80",affiliate:"#",badge:"Sale"},
{id:5,name:"Quilted Chain Bag",category:"Bags",price:59.99,oldPrice:95.00,img:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=400&q=80",affiliate:"#",badge:"Hot"},
{id:6,name:"Boho Tote Bag",category:"Bags",price:39.99,oldPrice:60.00,img:"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400&q=80",affiliate:"#",badge:""},
{id:7,name:"Pearl Drop Earrings",category:"Jewelry",price:19.99,oldPrice:35.00,img:"https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=400&q=80",affiliate:"#",badge:"New"},
{id:8,name:"Gold Bangle Set",category:"Jewelry",price:29.99,oldPrice:50.00,img:"https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=400&q=80",affiliate:"#",badge:""},
{id:9,name:"Block Heel Sandals",category:"Shoes",price:44.99,oldPrice:70.00,img:"https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=400&q=80",affiliate:"#",badge:"Sale"},
{id:10,name:"Strappy Heels",category:"Shoes",price:54.99,oldPrice:85.00,img:"https://images.unsplash.com/photo-1515347619252-60a4bf4fff4f?w=400&q=80",affiliate:"#",badge:""},
{id:11,name:"Pashmina Scarf",category:"Scarves",price:22.99,oldPrice:40.00,img:"https://images.unsplash.com/photo-1601924994987-69e26d50dc26?w=400&q=80",affiliate:"#",badge:""},
{id:12,name:"Cat-Eye Sunglasses",category:"Sunglasses",price:17.99,oldPrice:30.00,img:"https://images.unsplash.com/photo-1508296695146-257a814070b4?w=400&q=80",affiliate:"#",badge:"Hot"},
{id:13,name:"French Tip Nail Kit",category:"Nail",price:12.99,oldPrice:22.00,img:"https://images.unsplash.com/photo-1604654894610-df63bc536371?w=400&q=80",affiliate:"#",badge:"New"},
{id:14,name:"Gel Nail Polish Set",category:"Nail",price:18.99,oldPrice:32.00,img:"https://images.unsplash.com/photo-1604654894610-df63bc536371?w=400&q=80",affiliate:"#",badge:"Hot"},
{id:15,name:"Nail Art Sticker Pack",category:"Nail",price:7.99,oldPrice:14.00,img:"https://images.unsplash.com/photo-1604654894610-df63bc536371?w=400&q=80",affiliate:"#",badge:"Sale"},
];

const S = `
.ml-root{background:#f5f0e8;min-height:100vh;color:#1a1a1a}
.ml-nav{background:#0f0f0f;border-bottom:2px solid #c8b89a;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.ml-logo{font-family:'Cormorant Garamond',serif;color:#f0e6d3;font-size:26px;font-weight:800;letter-spacing:5px;padding:14px 0;cursor:pointer}
.ml-logo span{color:#c8b89a}
.ml-nav-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ml-nav-btn{background:none;border:none;color:#a89880;cursor:pointer;font-size:13px;padding:7px 13px;border-radius:6px;transition:all .2s;font-family:'Inter',sans-serif;font-weight:500}
.ml-nav-btn:hover{background:#1e1e1e;color:#f0e6d3}
.ml-nav-btn.active{background:#c8b89a22;color:#c8b89a;border-bottom:2px solid #c8b89a;border-radius:0}
.ml-cart-btn{background:#f0e6d3;color:#0f0f0f;border:none;border-radius:4px;padding:9px 20px;cursor:pointer;font-weight:700;font-size:13px;transition:all .15s}
.ml-cart-btn:hover{background:#c8b89a}
.ml-hero{background:#0f0f0f;padding:80px 24px 70px;text-align:center;position:relative;overflow:hidden;border-bottom:2px solid #c8b89a}
.ml-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,#c8b89a18 0%,transparent 70%)}
.ml-hero-eyebrow{font-size:11px;letter-spacing:7px;color:#c8b89a;margin-bottom:14px;font-weight:600;text-transform:uppercase}
.ml-hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(42px,9vw,88px);font-weight:800;color:#f0e6d3;line-height:1.0;margin-bottom:8px;letter-spacing:6px}
.ml-hero-divider{width:60px;height:2px;background:#c8b89a;margin:18px auto}
.ml-hero-sub{font-size:clamp(13px,2.5vw,16px);color:#7a6e62;margin-bottom:36px;letter-spacing:2px;text-transform:uppercase}
.ml-hero-btn{background:#f0e6d3;color:#0f0f0f;border:none;padding:16px 48px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:3px;text-transform:uppercase;transition:all .2s;font-family:'Inter',sans-serif}
.ml-hero-btn:hover{background:#c8b89a}
.cat-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:32px}
.cat-btn-3d{position:relative;padding:0;border:none;background:none;cursor:pointer;outline:none;transition:transform .1s}
.cat-btn-3d:active{transform:translateY(3px)}
.cat-face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:14px 18px;border-radius:4px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;min-width:76px;position:relative;z-index:1;transition:all .15s;text-transform:uppercase;background:#1a1a1a;color:#a89880;border:1.5px solid #333}
.cat-shadow{position:absolute;bottom:-4px;left:2px;right:2px;height:100%;border-radius:4px;z-index:0;background:#050505}
.cat-icon{font-size:22px}
.cat-btn-3d.active .cat-face{background:#f0e6d3;color:#0f0f0f;border-color:#c8b89a}
.cat-btn-3d.active .cat-shadow{background:#c8b89a}
.cat-btn-3d:hover:not(.active) .cat-face{background:#242424;color:#f0e6d3;border-color:#555}
.ml-section{padding:40px 16px;max-width:1200px;margin:0 auto}
.ml-section-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:#0f0f0f;margin-bottom:28px;text-align:center;letter-spacing:3px;text-transform:uppercase}
.ml-section-title::after{content:'';display:block;width:40px;height:2px;background:#c8b89a;margin:10px auto 0}
.ml-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.ml-card{background:#fff;border-radius:2px;overflow:hidden;border:1px solid #e8e0d5;transition:transform .25s,box-shadow .25s;cursor:pointer;position:relative}
.ml-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px #1a1a1a22;border-color:#c8b89a}
.ml-card-img{width:100%;height:240px;object-fit:cover;display:block;filter:grayscale(15%);transition:filter .3s}
.ml-card:hover .ml-card-img{filter:grayscale(0%)}
.ml-card-body{padding:14px 16px 16px;background:#fff}
.ml-card-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;margin-bottom:8px;color:#1a1a1a;letter-spacing:.5px}
.ml-price-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ml-price{color:#0f0f0f;font-weight:800;font-size:17px}
.ml-old-price{color:#aaa;text-decoration:line-through;font-size:13px}
.ml-badge{position:absolute;top:0;left:0;background:#0f0f0f;color:#f0e6d3;padding:5px 14px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.ml-badge.sale{background:#c8b89a;color:#0f0f0f}
.ml-badge.new{background:#3a3a3a}
.ml-wish-btn{position:absolute;top:10px;right:12px;background:#ffffffcc;border:1px solid #e8e0d5;font-size:18px;cursor:pointer;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ml-buy-btn{width:100%;background:#0f0f0f;color:#f0e6d3;border:none;padding:12px 0;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:2px;text-transform:uppercase;transition:all .2s;font-family:'Inter',sans-serif}
.ml-buy-btn:hover{background:#c8b89a;color:#0f0f0f}
.ml-tag{display:inline-block;background:#f5f0e8;color:#7a6e62;padding:2px 10px;font-size:10px;font-weight:700;margin-bottom:6px;border:1px solid #e8e0d5;letter-spacing:1px;text-transform:uppercase}
.ml-cart-overlay{position:fixed;top:0;right:0;width:min(380px,100vw);height:100vh;background:#0f0f0f;box-shadow:-4px 0 40px #00000088;z-index:200;display:flex;flex-direction:column;border-left:2px solid #c8b89a}
.ml-cart-header{background:#1a1a1a;color:#f0e6d3;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;border-bottom:1px solid #c8b89a44;letter-spacing:3px;text-transform:uppercase}
.ml-cart-item{display:flex;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid #1e1e1e}
.ml-cart-item-img{width:60px;height:60px;border-radius:2px;object-fit:cover}
.ml-cart-footer{padding:22px 24px;border-top:1px solid #c8b89a44;margin-top:auto}
.ml-modal{position:fixed;inset:0;background:#0f0f0fcc;z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
.ml-modal-box{background:#fff;border-radius:2px;max-width:520px;width:100%;overflow:hidden;box-shadow:0 24px 80px #00000066;border:1px solid #e8e0d5}
.ml-modal-img{width:100%;height:280px;object-fit:cover}
.ml-modal-body{padding:26px}
.ml-input{width:100%;padding:11px 14px;border:1.5px solid #ddd;background:#fafaf8;color:#1a1a1a;font-size:14px;margin-bottom:12px;outline:none;font-family:'Inter',sans-serif;transition:border .2s}
.ml-input:focus{border-color:#0f0f0f}
.ml-admin-card{background:#fff;padding:16px;margin-bottom:12px;border:1px solid #e8e0d5;display:flex;gap:14px;align-items:center}
.ml-admin-img{width:60px;height:60px;border-radius:2px;object-fit:cover}
.ml-search-wrap{text-align:center;margin-bottom:24px}
.ml-search{padding:13px 24px;border:1.5px solid #c8b89a;background:#fff;color:#1a1a1a;font-size:14px;width:min(380px,100%);outline:none;font-family:'Inter',sans-serif}
.ml-search:focus{border-color:#0f0f0f}
.ml-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#0f0f0f;color:#f0e6d3;padding:13px 32px;z-index:999;font-weight:700;font-size:13px;box-shadow:0 8px 30px #00000055;animation:fadeUp .3s ease;border-left:4px solid #c8b89a;letter-spacing:1px}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.ml-footer{background:#0f0f0f;padding:50px 16px;text-align:center;border-top:2px solid #c8b89a}
.ml-account-stat{background:#1a1a1a;padding:18px 32px;text-align:center;border:1px solid #333}
.ml-section-box{background:#fff;padding:30px;box-shadow:0 8px 30px #1a1a1a11;border:1px solid #e8e0d5}
.stripe{width:100%;height:3px;background:repeating-linear-gradient(90deg,#0f0f0f 0,#0f0f0f 12px,#c8b89a 12px,#c8b89a 24px)}
`;

function App() {
const [page,setPage]=useState("home");
const [cat,setCat]=useState("All");
const [search,setSearch]=useState("");
const [cart,setCart]=useState([]);
const [wishlist,setWishlist]=useState([]);
const [cartOpen,setCartOpen]=useState(false);
const [selected,setSelected]=useState(null);
const [user,setUser]=useState(null);
const [authMode,setAuthMode]=useState("login");
const [authForm,setAuthForm]=useState({name:"",email:"",password:""});
const [products,setProducts]=useState(INIT_PRODUCTS);
const [adminForm,setAdminForm]=useState({name:"",category:"Dresses",price:"",oldPrice:"",img:"",affiliate:"",badge:""});
const [editId,setEditId]=useState(null);
const [toast,setToast]=useState("");

const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),2200)};
const filtered=products.filter(p=>(cat==="All"||p.category===cat)&&p.name.toLowerCase().includes(search.toLowerCase()));
const addToCart=p=>{setCart(c=>{const ex=c.find(x=>x.id===p.id);return ex?c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x):[...c,{...p,qty:1}]});showToast("Added to cart ✓")};
const toggleWish=id=>setWishlist(w=>w.includes(id)?w.filter(x=>x!==id):[...w,id]);
const removeCart=id=>setCart(c=>c.filter(x=>x.id!==id));
const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
const handleAuth=()=>{if(authMode==="login"){if(authForm.email&&authForm.password){setUser({name:authForm.email.split("@")[0],email:authForm.email});setPage("home");showToast("Welcome back ✓")}}else{if(authForm.name&&authForm.email&&authForm.password){setUser({name:authForm.name,email:authForm.email});setPage("home");showToast("Account created ✓")}}};
const handleAdminSave=()=>{if(!adminForm.name||!adminForm.price)return;if(editId){setProducts(p=>p.map(x=>x.id===editId?{...x,...adminForm,price:+adminForm.price,oldPrice:+adminForm.oldPrice}:x));showToast("Updated ✓")}else{setProducts(p=>[...p,{...adminForm,id:Date.now(),price:+adminForm.price,oldPrice:+adminForm.oldPrice}]);showToast("Added ✓")}setAdminForm({name:"",category:"Dresses",price:"",oldPrice:"",img:"",affiliate:"",badge:""});setEditId(null)};
const startEdit=p=>{setAdminForm({name:p.name,category:p.category,price:p.price,oldPrice:p.oldPrice,img:p.img,affiliate:p.affiliate,badge:p.badge});setEditId(p.id)};
const deleteProduct=id=>{setProducts(p=>p.filter(x=>x.id!==id));showToast("Deleted")};
const exportJSON=()=>{const b=new Blob([JSON.stringify(products,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="products.json";a.click();showToast("JSON exported ✓")};
const exportCSV=()=>{const h=["id","name","category","price","oldPrice","badge","affiliate"];const r=products.map(p=>h.map(k=>'"'+(p[k]??"")+'"').join(","));const b=new Blob([[h.join(","),...r].join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="products.csv";a.click();showToast("CSV exported ✓")};
const bc=b=>b==="Sale"?"ml-badge sale":b==="New"?"ml-badge new":"ml-badge";

const Cat3D=({c})=>(
<button className={`cat-btn-3d${cat===c?" active":""}`} onClick={()=>setCat(c)}>
<div className="cat-shadow"/>
<div className="cat-face"><span className="cat-icon">{CAT_ICONS[c]}</span><span>{c}</span></div>
</button>
);

const Card=({p})=>(
<div className="ml-card" onClick={()=>setSelected(p)}>
{p.badge&&<span className={bc(p.badge)}>{p.badge}</span>}
<button className="ml-wish-btn" onClick={e=>{e.stopPropagation();toggleWish(p.id)}}>{wishlist.includes(p.id)?"♥":"♡"}</button>
<img src={p.img} alt={p.name} className="ml-card-img"/>
<div className="ml-card-body">
<span className="ml-tag">{p.category}</span>
<div className="ml-card-name">{p.name}</div>
<div className="ml-price-row"><span className="ml-price">${p.price}</span><span className="ml-old-price">${p.oldPrice}</span></div>
<button className="ml-buy-btn" onClick={e=>{e.stopPropagation();addToCart(p)}}>Add to Cart</button>
</div>
</div>
);

return (
<div className="ml-root">
<style>{S}</style>
{toast&&<div className="ml-toast">{toast}</div>}

<nav className="ml-nav">
<div className="ml-logo" onClick={()=>setPage("home")}>✦ MUSA <span>LOOM</span></div>
<div className="ml-nav-links">
{[{id:"home",l:"Home"},{id:"shop",l:"Shop"},{id:"wishlist",l:`Wishlist (${wishlist.length})`},user?{id:"account",l:user.name}:{id:"login",l:"Login"},user?.email==="admin@musaloom.com"?{id:"admin",l:"⚙ Admin"}:null].filter(Boolean).map(({id,l})=>(
<button key={id} className={`ml-nav-btn${page===id?" active":""}`} onClick={()=>setPage(id)}>{l}</button>
))}
<button className="ml-cart-btn" onClick={()=>setCartOpen(true)}>🛒 {cart.reduce((s,x)=>s+x.qty,0)}</button>
</div>
</nav>
<div className="stripe"/>

{page==="home"&&<>
<div className="ml-hero">
<div className="ml-hero-eyebrow">Women's Fashion & Accessories</div>
<h1 className="ml-hero-title">MUSA LOOM</h1>
<div className="ml-hero-divider"/>
<p className="ml-hero-sub">Curated fashion · Timeless elegance</p>
<button className="ml-hero-btn" onClick={()=>setPage("shop")}>Explore Collection</button>
</div>
<div className="stripe"/>
<div className="ml-section">
<h2 className="ml-section-title">Shop by Category</h2>
<div className="cat-grid">{CATEGORIES.slice(1).map(c=><Cat3D key={c} c={c}/>)}</div>
<h2 className="ml-section-title" style={{marginTop:20}}>Featured Picks</h2>
<div className="ml-grid">{products.filter(p=>p.badge).slice(0,4).map(p=><Card key={p.id} p={p}/>)}</div>
</div>
<div className="stripe"/>
<div className="ml-footer">
<div style={{fontFamily:"'Cormorant Garamond',serif",color:"#c8b89a",fontSize:22,fontWeight:700,marginBottom:8,letterSpacing:3}}>FREE SHIPPING OVER $60</div>
<div style={{color:"#5a5248",fontSize:13,letterSpacing:2,textTransform:"uppercase"}}>Curated picks · Best prices · Easy returns</div>
</div>
</>}

{page==="shop"&&<div className="ml-section">
<h2 className="ml-section-title">Shop All</h2>
<div className="ml-search-wrap"><input className="ml-search" placeholder="Search products..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
<div className="cat-grid">{CATEGORIES.map(c=><Cat3D key={c} c={c}/>)}</div>
<div className="ml-grid">
{filtered.map(p=><Card key={p.id} p={p}/>)}
{filtered.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",color:"#aaa",padding:50}}>No products found.</div>}
</div>
</div>}

{page==="wishlist"&&<div className="ml-section">
<h2 className="ml-section-title">My Wishlist</h2>
<div className="ml-grid">
{products.filter(p=>wishlist.includes(p.id)).map(p=><Card key={p.id} p={p}/>)}
{wishlist.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",color:"#aaa",padding:50}}>No items yet.</div>}
</div>
</div>}

{(page==="login"||page==="account")&&<div className="ml-section" style={{maxWidth:440}}>
{user?<>
<h2 className="ml-section-title">My Account</h2>
<div className="ml-section-box" style={{textAlign:"center"}}>
<div style={{fontSize:56,marginBottom:12}}>👤</div>
<div style={{fontFamily:"'Cormorant Garamond',serif",fontWeight:700,fontSize:24,color:"#0f0f0f",letterSpacing:2}}>{user.name.toUpperCase()}</div>
<div style={{color:"#aaa",marginBottom:28,fontSize:13}}>{user.email}</div>
<div style={{display:"flex",gap:12,justifyContent:"center",marginBottom:28}}>
<div className="ml-account-stat"><div style={{fontWeight:800,color:"#f0e6d3",fontSize:26}}>{cart.reduce((s,x)=>s+x.qty,0)}</div><div style={{fontSize:11,color:"#7a6e62",letterSpacing:1,textTransform:"uppercase"}}>Cart</div></div>
<div className="ml-account-stat"><div style={{fontWeight:800,color:"#f0e6d3",fontSize:26}}>{wishlist.length}</div><div style={{fontSize:11,color:"#7a6e62",letterSpacing:1,textTransform:"uppercase"}}>Wishlist</div></div>
</div>
<button className="ml-buy-btn" style={{padding:"13px 0"}} onClick={()=>{setUser(null);setPage("home");showToast("Logged out")}}>Logout</button>
</div>
</>:<>
<h2 className="ml-section-title">{authMode==="login"?"Login":"Sign Up"}</h2>
<div className="ml-section-box">
{authMode==="signup"&&<input className="ml-input" placeholder="Full Name" value={authForm.name} onChange={e=>setAuthForm({...authForm,name:e.target.value})}/>}
<input className="ml-input" placeholder="Email" value={authForm.email} onChange={e=>setAuthForm({...authForm,email:e.target.value})}/>
<input className="ml-input" type="password" placeholder="Password" value={authForm.password} onChange={e=>setAuthForm({...authForm,password:e.target.value})}/>
<button className="ml-buy-btn" style={{padding:"13px 0",marginBottom:16}} onClick={handleAuth}>{authMode==="login"?"Login":"Create Account"}</button>
<div style={{textAlign:"center",fontSize:13,color:"#aaa"}}>{authMode==="login"?"No account? ":"Have account? "}<span style={{color:"#0f0f0f",cursor:"pointer",fontWeight:700}} onClick={()=>setAuthMode(authMode==="login"?"signup":"login")}>{authMode==="login"?"Sign Up":"Login"}</span></div>
<div style={{textAlign:"center",fontSize:11,color:"#bbb",marginTop:10}}>ADMIN: admin@musaloom.com</div>
</div>
</>}
</div>}

{page==="admin"&&user?.email==="admin@musaloom.com"&&<div className="ml-section">
<h2 className="ml-section-title">Admin Dashboard</h2>
<div style={{display:"flex",gap:12,justifyContent:"center",marginBottom:28}}>
<button onClick={exportJSON} style={{background:"#0f0f0f",color:"#f0e6d3",border:"none",padding:"11px 28px",cursor:"pointer",fontWeight:700,fontSize:12,letterSpacing:2,textTransform:"uppercase"}}>⬇ Export JSON</button>
<button onClick={exportCSV} style={{background:"#c8b89a",color:"#0f0f0f",border:"none",padding:"11px 28px",cursor:"pointer",fontWeight:700,fontSize:12,letterSpacing:2,textTransform:"uppercase"}}>⬇ Export CSV</button>
</div>
<div className="ml-section-box" style={{marginBottom:28}}>
<h3 style={{color:"#0f0f0f",marginBottom:18,fontFamily:"'Cormorant Garamond',serif",fontSize:20,letterSpacing:2}}>{editId?"Edit Product":"Add New Product"}</h3>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
<input className="ml-input" placeholder="Name" value={adminForm.name} onChange={e=>setAdminForm({...adminForm,name:e.target.value})}/>
<select className="ml-input" value={adminForm.category} onChange={e=>setAdminForm({...adminForm,category:e.target.value})}>{CATEGORIES.slice(1).map(c=><option key={c}>{c}</option>)}</select>
<input className="ml-input" placeholder="Price" value={adminForm.price} onChange={e=>setAdminForm({...adminForm,price:e.target.value})}/>
<input className="ml-input" placeholder="Old Price" value={adminForm.oldPrice} onChange={e=>setAdminForm({...adminForm,oldPrice:e.target.value})}/>
<input className="ml-input" placeholder="Image URL" value={adminForm.img} onChange={e=>setAdminForm({...adminForm,img:e.target.value})} style={{gridColumn:"1/-1"}}/>
<input className="ml-input" placeholder="Affiliate Link" value={adminForm.affiliate} onChange={e=>setAdminForm({...adminForm,affiliate:e.target.value})}/>
<input className="ml-input" placeholder="Badge (Hot/New/Sale)" value={adminForm.badge} onChange={e=>setAdminForm({...adminForm,badge:e.target.value})}/>
</div>
<button className="ml-buy-btn" style={{padding:"13px 0"}} onClick={handleAdminSave}>{editId?"Update":"Add Product"}</button>
</div>
<h3 style={{color:"#0f0f0f",marginBottom:14,letterSpacing:2,fontSize:14,fontWeight:700,textTransform:"uppercase"}}>All Products ({products.length})</h3>
{products.map(p=>(
<div key={p.id} className="ml-admin-card">
<img src={p.img} alt={p.name} className="ml-admin-img" onError={e=>e.target.src="https://placehold.co/60x60?text=IMG"}/>
<div style={{flex:1}}><div style={{fontWeight:700,color:"#0f0f0f",fontFamily:"'Cormorant Garamond',serif",fontSize:16}}>{p.name}</div><div style={{fontSize:12,color:"#7a6e62"}}>{p.category} · ${p.price}</div></div>
<button style={{background:"#f5f0e8",border:"1px solid #c8b89a",padding:"7px 16px",cursor:"pointer",fontWeight:700,fontSize:12,marginRight:8}} onClick={()=>startEdit(p)}>Edit</button>
<button style={{background:"#0f0f0f",border:"none",padding:"7px 16px",cursor:"pointer",color:"#f0e6d3",fontWeight:700,fontSize:12}} onClick={()=>deleteProduct(p.id)}>Delete</button>
</div>
))}
</div>}

{cartOpen&&<>
<div style={{position:"fixed",inset:0,background:"#0f0f0faa",zIndex:199}} onClick={()=>setCartOpen(false)}/>
<div className="ml-cart-overlay">
<div className="ml-cart-header"><span>Cart</span><span style={{cursor:"pointer",fontSize:22,color:"#7a6e62"}} onClick={()=>setCartOpen(false)}>✕</span></div>
<div style={{overflowY:"auto",flex:1}}>
{cart.length===0&&<div style={{textAlign:"center",color:"#5a5248",padding:50,letterSpacing:2,textTransform:"uppercase",fontSize:13}}>Your cart is empty</div>}
{cart.map(item=>(
<div key={item.id} className="ml-cart-item">
<img src={item.img} alt={item.name} className="ml-cart-item-img"/>
<div style={{flex:1}}><div style={{fontWeight:600,fontSize:14,color:"#f0e6d3",fontFamily:"'Cormorant Garamond',serif"}}>{item.name}</div><div style={{color:"#c8b89a",fontWeight:700}}>${item.price} × {item.qty}</div></div>
<button style={{background:"none",border:"none",cursor:"pointer",color:"#7a6e62",fontSize:18}} onClick={()=>removeCart(item.id)}>✕</button>
</div>
))}
</div>
<div className="ml-cart-footer">
<div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:16,marginBottom:18,color:"#f0e6d3",letterSpacing:2}}><span style={{textTransform:"uppercase",fontSize:13}}>Total</span><span style={{color:"#c8b89a"}}>${total.toFixed(2)}</span></div>
<button style={{width:"100%",background:"#f0e6d3",color:"#0f0f0f",border:"none",padding:"14px 0",fontWeight:700,fontSize:12,cursor:"pointer",letterSpacing:2,textTransform:"uppercase"}} onClick={()=>{showToast("Redirecting to checkout...");setCartOpen(false)}}>Checkout →</button>
</div>
</div>
</>}

{selected&&<div className="ml-modal" onClick={()=>setSelected(null)}>
<div className="ml-modal-box" onClick={e=>e.stopPropagation()}>
<div style={{position:"relative"}}>
<img src={selected.img} alt={selected.name} className="ml-modal-img"/>
<button style={{position:"absolute",top:12,right:12,background:"#ffffffee",border:"1px solid #e8e0d5",width:36,height:36,fontSize:16,cursor:"pointer",color:"#0f0f0f"}} onClick={()=>setSelected(null)}>✕</button>
{selected.badge&&<span className={bc(selected.badge)}>{selected.badge}</span>}
</div>
<div className="ml-modal-body">
<span className="ml-tag">{selected.category}</span>
<h3 style={{margin:"10px 0",fontSize:24,fontFamily:"'Cormorant Garamond',serif",color:"#0f0f0f",letterSpacing:1}}>{selected.name}</h3>
<div className="ml-price-row"><span className="ml-price" style={{fontSize:22}}>${selected.price}</span><span className="ml-old-price">${selected.oldPrice}</span><span style={{color:"#2a7a2a",fontSize:13,fontWeight:700}}>Save ${(selected.oldPrice-selected.price).toFixed(2)}</span></div>
<p style={{color:"#7a6e62",fontSize:14,marginBottom:20,lineHeight:1.6}}>Handpicked affiliate product. Purchase securely from our trusted partner store.</p>
<div style={{display:"flex",gap:10}}>
<button className="ml-buy-btn" style={{flex:1,padding:"13px 0"}} onClick={()=>{addToCart(selected);setSelected(null)}}>Add to Cart</button>
<a href={selected.affiliate} target="_blank" rel="noreferrer" style={{flex:1,padding:"13px 0",background:"#c8b89a",color:"#0f0f0f",textDecoration:"none",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12,letterSpacing:2,textTransform:"uppercase"}}>Buy Now →</a>
</div>
</div>
</div>
</div>}
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
